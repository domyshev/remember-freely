name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: npm ci
      - run: python3 scripts/content.py validate examples/starter
      - run: python3 -m unittest discover -s scripts -p "test_*.py"
      - run: node --experimental-strip-types --test scripts/test-*.mjs
      - run: npm run lint
      - run: npm run build
      - run: go test ./backend/...
      - run: go vet ./backend/...
      - name: Build the tested production image
        run: |
          version=$(node -p "require('./package.json').version")
          docker build --build-arg APP_VERSION="$version" --build-arg GIT_SHA="$GITHUB_SHA" --tag "remember-freely:$GITHUB_SHA" .
          docker run --rm --entrypoint python3 "remember-freely:$GITHUB_SHA" -c 'import sqlite3, zipfile; print("Import runtime available")'
      - name: Package the verified image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          docker save "remember-freely:$GITHUB_SHA" | gzip -1 > web-image.tar.gz
      - name: Transfer the image to the release job
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-image
          path: web-image.tar.gz
          retention-days: 1

  release:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: production-main
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: production-image
      - name: Publish the tested image and checksum manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" != "$GITHUB_SHA" ]; then
            echo 'Main advanced; the newer verified commit will be published.'
            exit 0
          fi
          python3 - <<'PYTHON'
          import hashlib, json, os
          from pathlib import Path
          archive = Path('web-image.tar.gz')
          manifest = {'schema': 1, 'commit': os.environ['GITHUB_SHA'],
                      'image': 'remember-freely:' + os.environ['GITHUB_SHA'],
                      'sha256': hashlib.file_digest(archive.open('rb'), 'sha256').hexdigest(),
                      'runId': os.environ['GITHUB_RUN_ID']}
          Path('deployment.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PYTHON
          if ! gh release view "web-$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "web-$GITHUB_SHA" web-image.tar.gz deployment.json --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Web build $GITHUB_SHA" --notes 'Tested application image. Runtime data and credentials are not included.' --latest
          fi
      - name: Verify deployment and tag the successful commit
        if: vars.DEPLOYMENT_URL != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_URL: ${{ vars.DEPLOYMENT_URL }}
        run: |
          set -eu
          for attempt in $(seq 1 200); do
            if [ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" != "$GITHUB_SHA" ]; then
              echo 'Superseded by a newer main commit.'
              exit 0
            fi
            if curl --fail --silent --show-error --max-time 10 "$DEPLOYMENT_URL/version.json?expected=$GITHUB_SHA&attempt=$attempt" > live.json && python3 -c 'import json,os; assert json.load(open("live.json"))["commit"]==os.environ["GITHUB_SHA"]' && curl --fail --silent --show-error --max-time 10 "$DEPLOYMENT_URL/api/health" > health.json && python3 -c 'import json; assert json.load(open("health.json"))["status"]=="ok"'; then
              tag="deploy-web-$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_SHA:0:12}"
              gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA"
              printf '### Deployment verified\n\nCommit: `%s`\n\nTag: `%s`\n' "$GITHUB_SHA" "$tag" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 6
          done
          echo 'The target did not confirm this release; no deployment tag was created.' >&2
          exit 1
